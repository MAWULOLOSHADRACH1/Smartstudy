
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0756b8">
  <title>SmartStudy | Learn Better</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      color: #12345a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px;
      text-align: center;
      background: white;
    }

    .logo {
      font-size: 48px;
    }

    header h1 {
      color: #0756b8;
      font-size: 30px;
      margin-top: 8px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 35px 22px;
    }

    .hero {
      max-width: 520px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #0756b8;
    }

    .hero p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .illustration {
      font-size: 75px;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
      margin: auto;
    }

    .btn {
      display: block;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .primary {
      background: #0756b8;
      color: white;
    }

    .secondary {
      background: white;
      color: #0756b8;
      border: 2px solid #0756b8;
    }

    footer {
      text-align: center;
      padding: 22px;
      background: white;
      color: #56708e;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🧠</div>
    <h1>SmartStudy</h1>
  </header>

  <main>
    <section class="hero">
      <div class="illustration">📚 🎓 💡</div>

      <h2>Welcome to SmartStudy</h2>

      <p>
        Learn Better. Think Smarter. Go Further.
        <br><br>
        Discover knowledge, improve your skills
        and connect with learners around the world.
      </p>

      <div class="actions">
        <a href="#signin" class="btn primary">Sign in</a>
        <a href="#register" class="btn secondary">
          Create account
        </a>
      </div>
    </section>
  </main>

  <footer>
    Your Learning Journey Starts Here!
    <br>
    © 2026 SmartStudy
  </footer>

</body>
</html>
