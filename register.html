
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SmartStudy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef5ff;
      margin: 0;
      padding: 30px 15px;
      color: #17345c;
    }
    .container {
      max-width: 400px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ccd8e8;
    }
    h1, p { text-align: center; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input, select { border: 1px solid #ccd8e8; }
    button {
      border: none;
      background: #1769d2;
      color: white;
      font-weight: bold;
    }
    a { color: #1769d2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 SmartStudy</h1>
    <h2>Create your account</h2>
    <p>Learn Better. Think Smarter. Go Further.</p>

    <form id="registerForm">
      <input id="name" type="text" placeholder="Full name" required>
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (at least 8 characters)" minlength="8" required>
      <select id="accountType" required>
        <option value="">Choose account type</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
      <button type="submit">Create account</button>
      <p id="message" role="status"></p>
    </form>

    <p><a href="index.html">Back to homepage</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

     
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("registerForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const accountType = document.getElementById("accountType").value;

  try {
    message.textContent = "Creating your account...";

    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(result.user, { displayName: name });

    await setDoc(doc(db, "users", result.user.uid), {
      name,
      email,
      accountType,
      teacherStatus: accountType === "teacher" ? "pending" : "not_applicable",
      createdAt: new Date().toISOString()
    });

    message.textContent = "Welcome to SmartStudy! Your account was created.";
  } catch (error) {
    message.textContent = "Registration failed: " + error.message;
  }
});
 
  </script>
</body>
</html>
